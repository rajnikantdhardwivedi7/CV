<div class="cv-skills">
  <h2 class="cv-sidebar-heading">Skills</h2>
  {{ range . }}
    <div class="cv-skills-section">
      <h3 class="cv-skills-section-title">{{ .title }}</h3>
      {{ range .entry }}
        <div class="cv-skills-entry">
          <div class="cv-skills-entry--label">
            <p class="cv-skills-entry--name">{{ .name }}</p>
            {{ with .value }}
              <span class="cv-skills-entry--value">{{ . }}</span>
            {{ end }}
          </div>
          {{ with .rating }}
            {{ $rating := . }}
            <div class="cv-skills-dots" role="img" aria-label="Skill rating {{ $rating }} out of 5">
              {{ range $i := (seq 1 5) }}
                <span class="cv-skills-dot{{ if (le $i $rating) }} is-filled{{ end }}"></span>
              {{ end }}
            </div>
          {{ end }}
        </div>
      {{ end }}
    </div>
  {{ end }}
</div>
