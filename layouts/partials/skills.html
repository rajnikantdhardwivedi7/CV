<div class="cv-skills">
  <h2 class="cv-sidebar-heading">Skills</h2>
  {{ range . }}
    <div class="cv-skills-section">
      <h3 class="cv-skills-section-title">{{ .title }}</h3>
      {{ range .entry }}
        {{ $skill := . }}
        <div class="cv-skills-entry">
          <div class="cv-skills-entry--label">
            <p class="cv-skills-entry--name">{{ $skill.name }}</p>
            {{ with $skill.value }}<span class="cv-skills-entry--value">{{ . }}</span>{{ end }}
          </div>
          {{ with $skill.rating }}
            <div class="cv-skills-dots" role="img" aria-label="{{ $skill.name }} proficiency: {{ . }} out of 5">
              {{ range seq 5 }}
                <span class="cv-skills-dot{{ if le . $skill.rating }} is-filled{{ end }}"></span>
              {{ end }}
            </div>
          {{ end }}
        </div>
      {{ end }}
    </div>
  {{ end }}
</div>
